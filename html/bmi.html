<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="../style/bmi.css">
</head>
<body>
    <div class="container">
        
            <h1 class="heading">Body Mass Index (BMI) Calculator</h1>
        <p>Your Height (cm):
            <input type="number" value="180" class="input height-input">
        </p>
        <p>Your Weight (kg):
            <input type="number" value="160" class="input weight-input">
        </p>
        <button class="butn">Compute BMI</button>
        <p><input type="text" class="input txt" readonly></p>
        
        <h4 class="info">Weight Condition:</h4>
    
    </div>
    <script src="../script/bmi.js"></script>
</body>
</html>
