<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="../style/loan.css">
</head>
<body>
    <div class="container">
        <h1>Loan Calculator</h1>
        <p> Loan Amount $

         <input type="number" value="10000"  class="input" min="0" max="500000" id="bil" onChange="calculateLoan()"></p>
        <p> Interest Rate % 
         <input type="number" value="10" class="input" min="0" max="100"  id="bill"  onChange="calculateLoan()"></p>
         <p> Months to pay
        <input type="number" value="12"  class="input" min="6" max="48" id="bills"  onChange="calculateLoan()"></p>
    <p class="payment">Monthly payment:</p>
    </div>
    <script src="../script/loan.js"></script>
   
</body>
</html>
